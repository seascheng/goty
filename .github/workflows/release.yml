name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # CI builds sessiond only: the GUI bundle needs the locally built
      # libghostty dylib (see patches/build-libghostty.sh) and is produced
      # by swift-app/build.sh on a prepared machine.
      - run: cargo build --release --manifest-path swift-app/sessiond/Cargo.toml
      - run: |
          mkdir -p dist
          tar -czf dist/goty-sessiond-macos-aarch64.tar.gz \
            -C swift-app/sessiond/target/release goty-sessiond
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/goty-sessiond-macos-aarch64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
